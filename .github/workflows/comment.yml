name: Translation Regression Comment

on:
  workflow_run:
    workflows: ["Translations"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  post-comment:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Download regression artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: translation-regression
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/translation-regression

      - name: Show provenance
        run: |
          echo "triggering run head_repository=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "triggering run head_branch=${{ github.event.workflow_run.head_branch }}"
          echo "this repository=${{ github.repository }}"
          cat /tmp/translation-regression/pr-number.txt || true
          cat /tmp/translation-regression/regression-report.md || true

      - name: Post or update PR comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumberFile = '/tmp/translation-regression/pr-number.txt';
            const reportFile = '/tmp/translation-regression/regression-report.md';
            if (!fs.existsSync(prNumberFile) || !fs.existsSync(reportFile)) {
              console.log('Artifact files not found, skipping comment.');
              return;
            }
            const prNumber = parseInt(fs.readFileSync(prNumberFile, 'utf8').trim(), 10);
            if (!prNumber) {
              console.log('Could not parse PR number, skipping comment.');
              return;
            }
            const report = fs.readFileSync(reportFile, 'utf8');
            const marker = '<!-- translation-regression-bot -->';
            const body = `${marker}\n${report}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
              console.log(`Updated existing comment ${existing.id} on PR #${prNumber}`);
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body });
              console.log(`Created new comment on PR #${prNumber}`);
            }
